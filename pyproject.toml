[project]
name = "workorder-impl"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["shared", "services/*"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
