name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ── ① Lint & 構文チェック ──────────────────────────────────────────
  lint:
    name: Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dev deps
        run: uv sync --frozen --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: Python syntax (py_compile)
        run: |
          find . -name "*.py" -not -path "./.venv/*" \
            | xargs uv run python -m py_compile
          echo "py_compile: all files OK"

  # ── ② uv workspace 整合性 ──────────────────────────────────────────
  workspace:
    name: uv workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: uv sync --frozen (全サービス)
        run: uv sync --frozen --all-packages

  # ── ③ Docker Compose YAML 検証 ─────────────────────────────────────
  compose:
    name: docker-compose.yml validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YAML lint
        run: |
          python -c "
          import yaml
          yaml.safe_load(open('docker-compose.yml'))
          print('docker-compose.yml: YAML valid')
          "

      - name: docker compose config (dry-run)
        run: docker compose config --quiet

  # ── ④ アーキ整合性チェック (workorder-systems との比較) ───────────
  #
  # 前提: リポジトリ Settings > Secrets に SYSTEMS_REPO_TOKEN を登録する。
  #        (workorder-systems への read 権限を持つ PAT)
  #        未登録の場合はジョブ全体をスキップし、他のジョブをブロックしない。
  arch-sync:
    name: Architecture sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SYSTEMS_REPO_TOKEN
        id: prereq
        env:
          TOKEN: ${{ secrets.SYSTEMS_REPO_TOKEN }}
        run: |
          if [[ -n "$TOKEN" ]]; then
            echo "enabled=true"  >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⚠ SYSTEMS_REPO_TOKEN が未設定です。arch-sync をスキップします。"
            echo "  設定方法: リポジトリ Settings > Secrets and variables > Actions"
            echo "            > New repository secret: SYSTEMS_REPO_TOKEN"
            echo "            値: workorder-systems への read 権限を持つ PAT"
          fi

      - name: Checkout workorder-systems
        if: steps.prereq.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: takashikasuya/workorder-systems
          token: ${{ secrets.SYSTEMS_REPO_TOKEN }}
          path: workorder-systems

      - name: Install uv
        if: steps.prereq.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dev deps (pyyaml)
        if: steps.prereq.outputs.enabled == 'true'
        run: uv sync --frozen --group dev

      - name: Show workorder-systems layout (debug)
        if: steps.prereq.outputs.enabled == 'true'
        run: find workorder-systems -maxdepth 3 \( -name "*.yaml" -o -name "*.yml" \) | sort

      - name: Validate architecture sync
        if: steps.prereq.outputs.enabled == 'true'
        run: |
          uv run python scripts/validate_arch_sync.py \
            --systems-dir workorder-systems \
            --impl-dir .
